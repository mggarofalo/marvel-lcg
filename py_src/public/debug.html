<div id="debug-right-menu-options" class="debug-right-menu debug-only hide">
    <button style="color: teal;" onclick="Button.doEliminate()">Save</button>
    <hr />
    <hr />
    <button onclick="Button.doDebugStart()">New Game</button>
    <button onclick="Button.doRestart()">Restart</button>
    <hr />
    <hr />
    <button onclick="Debug.doDebugCmd(`Reveal('01190')`)">01190</button>
    <button onclick="Debug.doDebugCmd(`Play('01051')`)">Ally</button>
    <button onclick="Debug.doDebugCmd(`Play('42020')`)">Ally (AERIAL)</button>
    <button onclick="Debug.doDebugCmd(`Gains('01088', '01089', '01090')`)">Resource</button>
    <button onclick="Debug.doDebugCmd(`Play('09019')`)">Support</button>
    <button onclick="Debug.doDebugCmd(`Play('03010')`)">Upgrade</button>
    <button onclick="Debug.doDebugCmd(`PutIntoPlay('24062')`)">Retaliate</button>
    <hr />
    <hr />
    <button data-function="d.classList.contains('player-deck')" onclick="Debug.doDebugCmd(`Draw(5)`)">Draw</button>
</div>

<div id="debug-right-menu-deck" class="debug-right-menu debug-only hide">
    <button class="not-hide-after-clicked" data-function="true" onclick="Debug.doDebugCmd('SortDeck($0)')">Sort</button>
    <button data-function="true" onclick="Debug.doDebugCmd('DiscardDeck($0, 10)')">Empty</button>
</div>

<div id="debug-right-menu-card" class="debug-right-menu debug-only hide">
    <button data-function="c.is_in_play && c.is_ready && c.card_type != 'StatusCard'" onclick="Debug.doDebugCmd('Exhaust($0)')">Exhaust</button>
    <button data-function="c.is_in_play && !c.is_ready" onclick="Debug.doDebugCmd('Ready($0)')">Ready</button>
    <button data-function="!d.classList.contains('additional-discard-pile') && !d.classList.contains('player-discard-pile') && !d.classList.contains('encounter-discard-pile') && !['Hero', 'AlterEgo', 'MainScheme'].includes(c.card_type)" onclick="Debug.doDebugCmd('Discard($0)')">Discard</button>
    <button data-function="!c.is_in_play && ['Ally', 'Support', 'Upgrade', 'PlayerSideScheme', 'Minion', 'Environment', 'EncounterSideScheme', 'Attachment'].includes(c.card_type)" onclick="Debug.doDebugCmd('PutIntoPlay($0)')">Put Play</button>
    <button data-function="!['EncounterVillain', 'Leader', 'Hero', 'AlterEgo', 'MainScheme', 'StatusConfused', 'StatusStunned', 'StatusTough', 'StatusCard'].includes(c.card_type)" onclick="Debug.doDebugCmd('PutIntoDeck($0)')">Put Deck</button>
    <button data-function="['Attachment', 'Minion', 'EncounterSideScheme', 'Treachery', 'Obligation', 'Environment'].includes(c.card_type)" style="color: red;" onclick="Debug.doDebugCmd('Boost($0)')">Boost</button>
    <button data-function="['Attachment', 'Minion', 'EncounterSideScheme', 'Treachery', 'Obligation', 'Environment'].includes(c.card_type)" style="color: orange;" onclick="Debug.doDebugCmd('Deal($0)')">Deal</button>
    <button data-function="!c.is_in_hand && !['EncounterVillain', 'Leader', 'MainScheme', 'Ally', 'Hero', 'AlterEgo', 'Support', 'Upgrade', 'StatusCard', 'Event', 'PlayerSideScheme', 'Resource'].includes(c.card_type)" style="color: rgb(0, 81, 255);" onclick="Debug.doDebugCmd('Reveal($0)')">Reveal</button>
    <button data-function="!c.is_in_hand && ['Ally', 'Event', 'Resource', 'Support', 'Upgrade', 'PlayerSideScheme'].includes(c.card_type)" onclick="Debug.doDebugCmd('Gain($0)')">Gain</button>
    <details data-function="c.is_in_play && ['Hero', 'AlterEgo', 'EncounterVillain', 'Leader', 'Minion', 'Ally'].includes(c.card_type)">
        <summary style="color: green;">Health</summary>
        <div>
            <button onclick="Debug.doDebugCmd('Damage($0, 2)')">-2</button>
            <button onclick="Debug.doDebugCmd('Damage($0, 8)')">-8</button>
            <button onclick="Debug.doDebugCmd('Damage($0, 30)')">-30</button>
            <button onclick="Debug.doDebugCmd('Heal($0, 30)')">+30</button>
        </div>
    </details>
    <details data-function="c.is_in_play && ['EncounterSideScheme', 'MainScheme', 'PlayerSideScheme'].includes(c.card_type)">
        <summary style="color: #c4a951;">Threat</summary>
        <div>
            <button onclick="Debug.doDebugCmd('PlaceThreat($0, 2)')">+2</button>
            <button onclick="Debug.doDebugCmd('PlaceThreat($0, 5)')">+5</button>
            <button onclick="Debug.doDebugCmd('PlaceThreat($0, 15)')">+15</button>
            <button onclick="Debug.doDebugCmd('PlaceThreat($0, -2)')">-2</button>
            <button onclick="Debug.doDebugCmd('PlaceThreat($0, -30)')">-30</button>
            <button onclick="Debug.doDebugCmd('SetThreat($0, 1)')">=1</button>
        </div>
    </details>
    <button onclick="Debug.doDebugCmd('Remove($0)')">Remove </button>
    <button data-function="['Hero', 'AlterEgo'].includes(c.card_type)" onclick="Debug.doDebugCmd('ChangeForm($0)')">Change</button>
    <button data-function="!c.is_in_hand && c.is_in_play && !['StatusConfused', 'StatusStunned', 'StatusTough', 'StatusCard', 'Hero', 'AlterEgo'].includes(c.card_type)" onclick="Debug.doDebugCmd('Flip($0)')">Flip</button>
    <button data-function="c.is_in_play && !['StatusConfused', 'StatusStunned', 'StatusTough', 'StatusCard', 'Hero', 'AlterEgo'].includes(c.card_type)" onclick="Debug.doDebugCmd('Blank($0)')">Blank</button>
    <details data-function="c.is_in_play && ['Hero', 'AlterEgo', 'EncounterVillain', 'Leader', 'Minion', 'Ally'].includes(c.card_type)">
        <summary style="color: orange;">Status</summary>
        <div>
            <button style="background-color: #5b325e;" onclick="Debug.doDebugCmd('Confuse($0)')">Confuse</button>
            <button style="background-color: #e28c1d;" onclick="Debug.doDebugCmd('Stun($0)')">Stun</button>
            <button style="background-color: #c4a951;" onclick="Debug.doDebugCmd('Tough($0)')">Tough</button>
        </div>
    </details>
    <button data-function="c.is_in_play && ['EncounterVillain', 'Leader', 'Minion'].includes(c.card_type)" onclick="Debug.doDebugCmd('DoAttack($0)')">Do ATK</button>
    <button data-function="c.is_in_play && ['EncounterVillain', 'Leader', 'Minion'].includes(c.card_type)" onclick="Debug.doDebugCmd('DoScheme($0)')">Do SCH</button>
</div>

<textarea name='data' id='debug-cmd-input' class="hide" rows="1" placeholder=""></textarea>
<div id='debug-cmd-tooltip-box' class="hide">
    <textarea id='debug-cmd-text' rows="1" readonly></textarea>
</div>

<div id="debug-buttons" class="hide">
    <button class="button" onclick="Button.nextFrame()" id="next-frame">Next</button>
    <button class="button" onclick="document.querySelector('#debug-window').classList.toggle('hide')">Message</button>
</div>
