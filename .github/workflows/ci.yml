name: CI

# Every gate in this workflow is verified green on BOTH windows-latest and
# ubuntu-latest. A red master must mean "something broke", never "that gate has
# never worked on Linux".

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede a PR's own earlier runs, but never cancel a master run: the point
  # of this workflow is that a red master is visible, and a cancelled run
  # leaves the commit that broke it with no verdict at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: C# engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      # Two installs on purpose. `global.json` pins the SDK that builds; the
      # assemblies target `net8.0` so Godot can reference them
      # (Directory.Build.props), and running the tests on the .NET 8 runtime
      # rather than rolling forward to 10 is the point -- JSON escaping is
      # runtime behaviour, so it has to be exercised on the runtime the client
      # will actually host.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      # `--locked-mode` would be better still, but central package management
      # writes no lock file by default; the pins in Directory.Packages.props
      # are what stops a transitive version from drifting between these two
      # legs.
      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props). This engine is validated
      # byte-for-byte against another implementation, so the class of bug a
      # compiler can catch is exactly the class that is most expensive to find
      # later.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # `datasets/rules-reference/entries/*.md` is what these are held to.
      # There was a time when the acceptance criteria were fixtures emitted by
      # the Python engine, and disagreeing with them meant C# was wrong; that
      # is no longer true and the fixtures are going. The rulebook decides.
      - name: Test
        run: dotnet test --no-build --configuration Release

      # The wall (MARVEL-162). `Directory.Build.targets` fails any build below
      # `Marvel.Godot` that can see `GodotSharp`, or that targets a framework
      # Godot cannot reference -- so the Build step above is already the
      # positive case, on every project in the solution, on both legs.
      #
      # This is the other half: it builds four throwaway projects that are
      # *supposed* to fail and checks that they fail for the stated reason. An
      # `<Error>` condition nobody has watched evaluate to true is a claim
      # about a build rather than a property of one. Offline -- the GodotSharp
      # it references is a stub. See tests/godot-wall/README.md.
      - name: The wall's gates fire
        run: bash tools/godot-wall.sh
