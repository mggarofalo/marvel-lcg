name: CI

# Routine runs check managed correctness once and platform boundaries on both
# supported runners. Exhaustive certification is explicit or release-required.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      exhaustive:
        description: Run the cross-platform exhaustive certification profile.
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      exhaustive:
        description: Run the cross-platform exhaustive certification profile.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede a PR's own earlier runs, but never cancel a main run: the point
  # of this workflow is that a red main is visible, and a cancelled run
  # leaves the commit that broke it with no verdict at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ inputs.exhaustive || (github.event_name != 'push' && github.event_name != 'pull_request') || steps.filter.outputs.non_markdown != 'false' || steps.filter.outputs.any != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: ${{ !inputs.exhaustive && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        with:
          # Git comparison avoids extra API permissions in release callers.
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.ref }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          filters: |
            any:
              - '**'
            non_markdown:
              - '!**/*.[mM][dD]'

  managed:
    name: Managed correctness
    needs: changes
    if: ${{ !inputs.exhaustive && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.424
            10.0.400

      - name: Set up quality-tool Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pinned complexity tools
        run: python -m pip install --requirement tools/requirements-quality.txt

      - name: Enforce source complexity and file length
        run: |
          dotnet tool restore
          dotnet husky install
          dotnet husky exec .husky/csx/complexity.csx
          dotnet husky exec .husky/csx/file-length.csx

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Fast unit and behavioral tests
        run: dotnet test tests/Marvel.UnitTests.slnx --no-build --configuration Release

      - name: Acceptance and regression sweeps
        run: dotnet test tests/Marvel.Acceptance.Tests/Marvel.Acceptance.Tests.csproj --no-build --configuration Release

      - name: The Core behavioral obligation catalog is complete
        run: dotnet run --project tools/Marvel.Behavior.Index --no-build --configuration Release -- check

      - name: The Core behavioral specification passes
        run: dotnet run --project tools/Marvel.Behavior.Run --no-build --configuration Release -- check

      - name: The card dataset is what the generator produces
        run: dotnet run --project tools/Marvel.Cards.Extract --no-build --configuration Release -- check

      - name: The rulings index is what the vendored pages produce
        run: dotnet run --project tools/Marvel.Rulings.Harvest --no-build --configuration Release -- check

  platform-gates:
    name: Platform gates (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    # Reserve time for hosted checks after managed integration.
    # Windows needs about 80 minutes for managed integration plus hosted checks.
    # Individual smoke processes retain their own deadlines.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Establish the reviewed architecture baseline
        shell: pwsh
        env:
          MARVEL_ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./tools/architecture-base.ps1

      - name: Native process deadlines contain descendant processes
        shell: pwsh
        run: ./tools/native-process-tests.ps1

      - name: Native case admission rejects malformed inputs
        shell: pwsh
        run: ./tools/native-manifest-tests.ps1

      - name: Native shards retain exact membership and required results
        shell: pwsh
        run: ./tools/native-shard-tests.ps1

      # Build with the pinned SDK and execute on the net8.0 runtime Godot hosts.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.424
            10.0.400

      - name: Set up quality-tool Python
        if: ${{ inputs.exhaustive }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pinned complexity tools
        if: ${{ inputs.exhaustive }}
        run: python -m pip install --requirement tools/requirements-quality.txt

      - name: Enforce source complexity and file length
        if: ${{ inputs.exhaustive }}
        run: |
          dotnet tool restore
          dotnet husky install
          dotnet husky exec .husky/csx/complexity.csx
          dotnet husky exec .husky/csx/file-length.csx

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Certification repeats managed checks on both operating systems.
      # Routine runs execute them once in Managed correctness.
      - name: Fast unit and behavioral tests
        if: ${{ inputs.exhaustive }}
        run: dotnet test tests/Marvel.UnitTests.slnx --no-build --configuration Release

      - name: Architecture, server, Godot and release integration tests
        run: dotnet test tests/Marvel.IntegrationTests.slnx --no-build --configuration Release -m:1

      - name: Acceptance and regression sweeps
        if: ${{ inputs.exhaustive }}
        run: dotnet test tests/Marvel.Acceptance.Tests/Marvel.Acceptance.Tests.csproj --no-build --configuration Release

      - name: The presentation project walls fire
        shell: pwsh
        run: ./tools/presentation-wall.ps1

      - name: Install Godot 4.7 .NET (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output godot-mono.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          echo "6ca7ff0459f1b806900be683c1b0837c607a9c16834c530dc68c81b9fc3ae1f6  godot-mono.zip" | sha256sum --check
          unzip -q godot-mono.zip -d godot-mono
          GODOT_BIN=$(find godot-mono -type f -name 'Godot*_mono_linux.*' | head -1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GITHUB_WORKSPACE/$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot 4.7 .NET (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip" `
            -OutFile godot-mono.zip
          $actual = (Get-FileHash godot-mono.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "764a089809fb1a6f745686ce9f6d3ca83adce8fb60fb9a4e2324b63baaebaa45") {
            throw "Godot archive hash mismatch: $actual"
          }
          Expand-Archive godot-mono.zip -DestinationPath godot-mono
          $godot = Get-ChildItem godot-mono -Recurse -Filter '*_console.exe' | Select-Object -First 1
          if ($null -eq $godot) { throw "Godot .NET console executable was not found" }
          "GODOT_BIN=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Two restricted clients complete a hosted game (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/godot-hosted-multiplayer-smoke.sh "$GODOT_BIN"

      - name: Two restricted clients complete a hosted game (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/godot-hosted-multiplayer-smoke.ps1 -GodotBin $env:GODOT_BIN

      - name: Unused invitation stays in the desktop sidebar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/godot-hosted-multiplayer-smoke.sh "$GODOT_BIN" --invitation-layout

      - name: Unused invitation stays in the desktop sidebar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/godot-hosted-multiplayer-smoke.ps1 -GodotBin $env:GODOT_BIN -InvitationLayout

      - name: The supported Linux server container hosts a restricted game
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image=marvel-server-ci
          container=marvel-server-ci-${{ github.run_id }}
          volume=marvel-server-ci-${{ github.run_id }}
          diagnostics=marvel-diagnostics-ci-${{ github.run_id }}
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            docker volume rm "$diagnostics" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker build --file src/Marvel.Server/Dockerfile --tag "$image" .
          compose=$(MARVEL_SERVER_IMAGE="$image" docker compose config)
          grep -q 'container_name: marvel-server' <<<"$compose"
          grep -q 'name: marvel-sessions' <<<"$compose"
          grep -q 'name: marvel-diagnostics' <<<"$compose"
          [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image") == 0.1.0-dev.0 ]]
          docker run --rm --entrypoint dotnet "$image" Marvel.Server.Host.dll --version |
            grep -F 'v0.1.0-dev.0 · engine engine-replay-v34 · protocol 46 · save 7'
          docker volume create "$volume" >/dev/null
          docker volume create "$diagnostics" >/dev/null
          docker run --detach --name "$container" \
            --stop-timeout 40 \
            --publish 127.0.0.1:41924:41923 \
            --volume "$volume:/var/lib/marvel/sessions" \
            --volume "$diagnostics:/var/lib/marvel/diagnostics" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 1 --pids-limit 128 \
            "$image" --visibility restricted --seat 0
          for attempt in {1..300}; do
            if [[ $(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container") == healthy ]]; then
              break
            fi
            if [[ $(docker inspect --format '{{.State.Running}}' "$container") != true ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 0.1
          done
          [[ $(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container") == healthy ]] || {
            docker logs "$container"
            exit 1
          }
          set +e
          MARVEL_HOSTED_SMOKE_EXTERNAL_SERVER=true \
            MARVEL_HOSTED_SMOKE_PORT=41924 \
            bash tools/godot-hosted-multiplayer-smoke.sh "$GODOT_BIN"
          smoke_status=$?
          set -e
          docker stop "$container"
          server_status=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          docker start "$container"
          for attempt in {1..300}; do
            if [[ $(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container") == healthy ]]; then
              break
            fi
            sleep 0.1
          done
          [[ $(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container") == healthy ]] || {
            docker logs "$container"
            exit 1
          }
          docker logs "$container" > "$RUNNER_TEMP/marvel-server.log" 2>&1
          grep -q '"event_id":"session.restore.completed"' "$RUNNER_TEMP/marvel-server.log"
          docker run --rm \
            --volume "$diagnostics:/diagnostics:ro" \
            --entrypoint sh "$image" -c \
            'grep -q session.restore.completed /diagnostics/operational.jsonl'
          docker stop "$container"
          docker logs "$container"
          if [[ $smoke_status -ne 0 || $server_status -ne 0 ]]; then
            exit 1
          fi

      - name: Representative Godot states render correctly (Linux)
        if: ${{ inputs.exhaustive && runner.os == 'Linux' }}
        shell: bash
        env:
          MARVEL_SMOKE_CAPTURE_DIR: ${{ runner.temp }}/godot-visual-qa
        run: bash tools/godot-visual-qa.sh "$GODOT_BIN"

      - name: Representative Godot states render correctly (Windows)
        if: ${{ inputs.exhaustive && runner.os == 'Windows' }}
        shell: pwsh
        env:
          MARVEL_SMOKE_CAPTURE_DIR: ${{ runner.temp }}\godot-visual-qa
        run: tools/godot-visual-qa.ps1 -GodotBin $env:GODOT_BIN

      - name: Retain Godot visual checkpoints
        if: ${{ inputs.exhaustive }}
        uses: actions/upload-artifact@v6
        with:
          name: godot-visual-qa-${{ runner.os }}
          path: ${{ runner.temp }}/godot-visual-qa/*.png
          if-no-files-found: error
          retention-days: 7

      - name: The contextual table redesign passes rendered acceptance (Linux)
        if: ${{ inputs.exhaustive && runner.os == 'Linux' }}
        shell: bash
        env:
          MARVEL_SMOKE_CAPTURE_DIR: ${{ runner.temp }}/godot-redesign-qa
        run: xvfb-run -a bash tools/godot-redesign-gate.sh "$GODOT_BIN"

      - name: The contextual table redesign passes rendered acceptance (Windows)
        if: ${{ inputs.exhaustive && runner.os == 'Windows' }}
        shell: pwsh
        env:
          MARVEL_SMOKE_CAPTURE_DIR: ${{ runner.temp }}\godot-redesign-qa
        run: tools/godot-redesign-gate.ps1 -GodotBin $env:GODOT_BIN

      - name: Retain contextual table acceptance checkpoints
        if: ${{ always() && inputs.exhaustive }}
        uses: actions/upload-artifact@v6
        with:
          name: godot-redesign-qa-${{ runner.os }}
          path: ${{ runner.temp }}/godot-redesign-qa/**/*.png
          if-no-files-found: error
          retention-days: 90

      - name: The Core behavioral obligation catalog is complete
        if: ${{ inputs.exhaustive }}
        run: dotnet run --project tools/Marvel.Behavior.Index --no-build --configuration Release -- check

      - name: The Core behavioral specification passes
        if: ${{ inputs.exhaustive }}
        run: dotnet run --project tools/Marvel.Behavior.Run --no-build --configuration Release -- check

      - name: The card dataset is what the generator produces
        if: ${{ inputs.exhaustive }}
        run: dotnet run --project tools/Marvel.Cards.Extract --no-build --configuration Release -- check

      - name: The rulings index is what the vendored pages produce
        if: ${{ inputs.exhaustive }}
        run: dotnet run --project tools/Marvel.Rulings.Harvest --no-build --configuration Release -- check

      - name: The wall's gates fire
        shell: pwsh
        run: ./tools/godot-wall.ps1

  native-journeys:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    name: Native journeys (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # A Windows representative shard needs about 40 minutes of native cases.
    timeout-minutes: ${{ inputs.exhaustive && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.424
            10.0.400

      - name: Install Godot 4.7 .NET (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output godot-mono.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          echo "6ca7ff0459f1b806900be683c1b0837c607a9c16834c530dc68c81b9fc3ae1f6  godot-mono.zip" | sha256sum --check
          unzip -q godot-mono.zip -d godot-mono
          GODOT_BIN=$(find godot-mono -type f -name 'Godot*_mono_linux.*' | head -1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GITHUB_WORKSPACE/$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot 4.7 .NET (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip" `
            -OutFile godot-mono.zip
          $actual = (Get-FileHash godot-mono.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "764a089809fb1a6f745686ce9f6d3ca83adce8fb60fb9a4e2324b63baaebaa45") {
            throw "Godot archive hash mismatch: $actual"
          }
          Expand-Archive godot-mono.zip -DestinationPath godot-mono
          $godot = Get-ChildItem godot-mono -Recurse -Filter '*_console.exe' | Select-Object -First 1
          if ($null -eq $godot) { throw "Godot .NET console executable was not found" }
          "GODOT_BIN=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Scripted acceptance builds the client and verifies its driver
        if: matrix.shard == 0
        shell: pwsh
        run: |
          ./tools/godot-acceptance.ps1 -GodotBin $env:GODOT_BIN `
            -Script res://smoke/automation/opening_hand_acceptance.gd `
            -ResultsDirectory "$env:RUNNER_TEMP/native-evidence-0/acceptance-opening"
          ./tools/godot-acceptance.ps1 -GodotBin $env:GODOT_BIN -NoBuild `
            -ResultsDirectory "$env:RUNNER_TEMP/native-evidence-0/acceptance-driver"

      - name: The selected native profile completes its exact shard
        shell: pwsh
        env:
          NATIVE_PROFILE: ${{ inputs.exhaustive && 'exhaustive' || 'representative' }}
          MARVEL_NATIVE_RESULTS_DIRECTORY: ${{ runner.temp }}/native-evidence-${{ matrix.shard }}
        run: |
          # Rendered contract entries need a display even in the representative profile.
          if ($IsLinux) {
            xvfb-run -a pwsh -NoProfile -File ./tools/native-cases.ps1 -GodotBin $env:GODOT_BIN -Profile $env:NATIVE_PROFILE -ShardCount 2 -ShardIndex ${{ matrix.shard }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            ./tools/native-cases.ps1 -GodotBin $env:GODOT_BIN -Profile $env:NATIVE_PROFILE -ShardCount 2 -ShardIndex ${{ matrix.shard }}
          }

      - name: Retain native shard inputs and results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/native-evidence-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: ignore

  platform:
    name: Native integration (${{ matrix.os }})
    # Expand both required names even for Markdown-only changes; only the receipts run.
    if: ${{ always() }}
    needs: [changes, platform-gates, native-journeys]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.exhaustive && 90 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.run == 'true' }}
      - name: Require successful scope selection
        if: ${{ needs.changes.result != 'success' || (needs.changes.outputs.run != 'true' && needs.changes.outputs.run != 'false') }}
        run: exit 1
      - name: Complete the required check for Markdown-only changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.run == 'false' }}
        run: echo 'Markdown-only change; runtime validation is not required.'
      - name: Require every platform gate and native shard to succeed
        if: ${{ needs.changes.outputs.run == 'true' }}
        shell: pwsh
        env:
          PLATFORM_GATES_RESULT: ${{ needs.platform-gates.result }}
          NATIVE_JOURNEYS_RESULT: ${{ needs.native-journeys.result }}
        run: ./tools/native-integration-result.ps1 -PlatformGates $env:PLATFORM_GATES_RESULT -NativeJourneys $env:NATIVE_JOURNEYS_RESULT

  desktop-package:
    name: Windows desktop community package
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.424
            10.0.400

      - name: Install pinned Godot editor and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip" `
            -OutFile "$env:RUNNER_TEMP\godot.zip"
          $godotHash = (Get-FileHash "$env:RUNNER_TEMP\godot.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($godotHash -cne "764a089809fb1a6f745686ce9f6d3ca83adce8fb60fb9a4e2324b63baaebaa45") { throw "Godot editor hash mismatch" }
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot"
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz" `
            -OutFile "$env:RUNNER_TEMP\templates.tpz"
          $templateHash = (Get-FileHash "$env:RUNNER_TEMP\templates.tpz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($templateHash -cne "ef9a708be51ecd974cd7dccdcafd7a1870da3d3e1c24c072bdbb9818c7a7db63") { throw "Godot templates hash mismatch" }
          Expand-Archive "$env:RUNNER_TEMP\templates.tpz" -DestinationPath "$env:RUNNER_TEMP\templates"
          $templateTarget = Join-Path $env:APPDATA "Godot\export_templates\4.7.1.stable.mono"
          New-Item -ItemType Directory -Path $templateTarget -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $templateTarget -Recurse -Force
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -Filter '*_console.exe' | Select-Object -First 1
          if ($null -eq $godot) { throw "Godot .NET console executable was not found" }
          "GODOT_BIN=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: The unsigned desktop payload is complete
        shell: pwsh
        run: |
          tools/build-windows-desktop.ps1 `
            -GodotBin $env:GODOT_BIN `
            -Version '0.1.0-preview.1' `
            -Commit '${{ github.sha }}' `
            -Publisher 'CN=Marvel Champions Community' `
            -Output "$env:RUNNER_TEMP\windows-desktop"

      - name: The ephemeral self-signature verifies without a timestamp
        shell: pwsh
        run: |
          $unsigned = Get-ChildItem "$env:RUNNER_TEMP\windows-desktop" `
            -Filter '*-unsigned.msix' | Select-Object -First 1
          if ($null -eq $unsigned) { throw 'unsigned Windows input was not built' }
          tools/sign-windows-desktop.ps1 `
            -InputPackage $unsigned.FullName `
            -Output "$env:RUNNER_TEMP\windows-community" `
            -Publisher 'CN=Marvel Champions Community'

      - uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-community-${{ github.sha }}
          path: |
            ${{ runner.temp }}/windows-desktop/*.msix
            ${{ runner.temp }}/windows-desktop/*.zip
            ${{ runner.temp }}/windows-desktop/*.sha256
            ${{ runner.temp }}/windows-community/*
          if-no-files-found: error
          retention-days: 7
