name: Desktop release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Validate protected tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      preview: ${{ steps.identity.outputs.preview }}
    steps:
      - name: The tag is one supported product version
        id: identity
        shell: bash
        run: |
          if [[ $GITHUB_REF_PROTECTED != true ]]; then
            echo 'release tag is not protected by an active repository ruleset' >&2
            exit 2
          fi
          version=${GITHUB_REF_NAME#v}
          if [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            preview=false
          elif [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.([1-9][0-9]*)$ ]]; then
            preview=true
          else
            echo 'release tag is not stable or preview SemVer' >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"

  quality:
    name: Ordinary release gates
    needs: identity
    uses: ./.github/workflows/ci.yml

  macos-input:
    name: Reproducible unsigned macOS input
    needs: [identity, quality]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Install pinned Godot editor and export templates
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_macos.universal.zip
          echo '92cac516baa8ddc7756eeaa38a6d007778a968bfbf188db7c5d6e6ec21c5d52c  '${RUNNER_TEMP}'/godot.zip' | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/templates.tpz" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz
          echo 'ef9a708be51ecd974cd7dccdcafd7a1870da3d3e1c24c072bdbb9818c7a7db63  '${RUNNER_TEMP}'/templates.tpz' | shasum -a 256 --check
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.1.stable.mono"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." \
            "$HOME/Library/Application Support/Godot/export_templates/4.7.1.stable.mono/"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Build unsigned application and release manifest
        shell: bash
        run: |
          bash tools/build-macos-desktop.sh \
            --godot "$GODOT_BIN" \
            --version '${{ needs.identity.outputs.version }}' \
            --commit '${{ needs.identity.outputs.commit }}' \
            --output "$RUNNER_TEMP/macos-input"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-unsigned-input
          path: |
            ${{ runner.temp }}/macos-input/*-unsigned.zip
            ${{ runner.temp }}/macos-input/*-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows-input:
    name: Reproducible unsigned Windows input
    needs: [identity, quality]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Install pinned Godot editor and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip' `
            -OutFile "$env:RUNNER_TEMP\godot.zip"
          $godotHash = (Get-FileHash "$env:RUNNER_TEMP\godot.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($godotHash -cne '764a089809fb1a6f745686ce9f6d3ca83adce8fb60fb9a4e2324b63baaebaa45') { throw 'Godot editor hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot"
          Invoke-WebRequest `
            -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz' `
            -OutFile "$env:RUNNER_TEMP\templates.tpz"
          $templateHash = (Get-FileHash "$env:RUNNER_TEMP\templates.tpz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($templateHash -cne 'ef9a708be51ecd974cd7dccdcafd7a1870da3d3e1c24c072bdbb9818c7a7db63') { throw 'Godot templates hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\templates.tpz" -DestinationPath "$env:RUNNER_TEMP\templates"
          $templateTarget = Join-Path $env:APPDATA 'Godot\export_templates\4.7.1.stable.mono'
          New-Item -ItemType Directory -Path $templateTarget -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $templateTarget -Recurse -Force
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -Filter '*_console.exe' | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot .NET console executable was not found' }
          "GODOT_BIN=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build unsigned MSIX input
        shell: pwsh
        run: |
          tools/build-windows-desktop.ps1 `
            -GodotBin $env:GODOT_BIN `
            -Version '${{ needs.identity.outputs.version }}' `
            -Commit '${{ needs.identity.outputs.commit }}' `
            -Publisher '${{ vars.WINDOWS_PUBLISHER }}' `
            -Output "$env:RUNNER_TEMP\windows-input"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-unsigned-input
          path: |
            ${{ runner.temp }}/windows-input/*-unsigned.msix
            ${{ runner.temp }}/windows-input/*-unsigned.msix.sha256
          if-no-files-found: error
          retention-days: 7

  macos-sign:
    name: Sign and notarize macOS
    needs: [identity, macos-input]
    runs-on: macos-latest
    timeout-minutes: 45
    environment: desktop-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: desktop-macos-unsigned-input
          path: ${{ runner.temp }}/macos-input

      - name: Import ephemeral signing credentials
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          MARVEL_RELEASE_KEYCHAIN: ${{ runner.temp }}/marvel-release.keychain-db
          MARVEL_RELEASE_CERTIFICATE: ${{ runner.temp }}/marvel-release.p12
          MARVEL_APPLE_API_KEY_FILE: ${{ runner.temp }}/marvel-release-api-key.p8
        run: |
          keychain_password=$(uuidgen)
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$MARVEL_RELEASE_CERTIFICATE"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$MARVEL_APPLE_API_KEY_FILE"
          security create-keychain -p "$keychain_password" "$MARVEL_RELEASE_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$MARVEL_RELEASE_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$MARVEL_RELEASE_KEYCHAIN"
          security import "$MARVEL_RELEASE_CERTIFICATE" -k "$MARVEL_RELEASE_KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$MARVEL_RELEASE_KEYCHAIN"
          security list-keychains -d user -s "$MARVEL_RELEASE_KEYCHAIN"

      - name: Expand, sign, notarize, staple, and verify
        shell: bash
        env:
          MARVEL_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MARVEL_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          MARVEL_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MARVEL_APPLE_API_KEY_FILE: ${{ runner.temp }}/marvel-release-api-key.p8
        run: |
          unsigned=$(find "$RUNNER_TEMP/macos-input" -maxdepth 1 -name '*-unsigned.zip' -type f)
          [[ -n "$unsigned" ]] || { echo 'unsigned macOS input was not downloaded' >&2; exit 2; }
          ditto -x -k "$unsigned" "$RUNNER_TEMP/macos-input"
          bash tools/sign-macos-desktop.sh \
            --input "$RUNNER_TEMP/macos-input" \
            --output "$RUNNER_TEMP/macos-signed"

      - name: Destroy signing credentials
        if: always()
        shell: bash
        env:
          MARVEL_RELEASE_KEYCHAIN: ${{ runner.temp }}/marvel-release.keychain-db
          MARVEL_RELEASE_CERTIFICATE: ${{ runner.temp }}/marvel-release.p12
          MARVEL_APPLE_API_KEY_FILE: ${{ runner.temp }}/marvel-release-api-key.p8
        run: |
          security delete-keychain "$MARVEL_RELEASE_KEYCHAIN" || true
          rm -f "$MARVEL_RELEASE_CERTIFICATE" "$MARVEL_APPLE_API_KEY_FILE"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-signed
          path: ${{ runner.temp }}/macos-signed/*
          if-no-files-found: error

  windows-sign:
    name: Sign and verify Windows
    needs: [identity, windows-input]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: desktop-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows-unsigned-input
          path: ${{ runner.temp }}/windows-input

      - name: Import ephemeral signing certificate
        shell: pwsh
        env:
          CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          MARVEL_WINDOWS_CERTIFICATE: ${{ runner.temp }}\marvel-release.pfx
        run: |
          [IO.File]::WriteAllBytes(
            $env:MARVEL_WINDOWS_CERTIFICATE,
            [Convert]::FromBase64String($env:CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $parsed = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:MARVEL_WINDOWS_CERTIFICATE,
            $env:CERTIFICATE_PASSWORD,
            $flags)
          try {
            $thumbprint = $parsed.Thumbprint
          }
          finally {
            $parsed.Dispose()
          }
          "MARVEL_WINDOWS_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append
          $certificate = Import-PfxCertificate `
            -FilePath $env:MARVEL_WINDOWS_CERTIFICATE `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if ($certificate.Thumbprint -cne $thumbprint) { throw 'imported certificate identity changed' }

      - name: Sign, timestamp, package, and verify
        shell: pwsh
        run: |
          $unsigned = Get-ChildItem "$env:RUNNER_TEMP\windows-input" -Filter '*-unsigned.msix' |
            Select-Object -First 1
          if ($null -eq $unsigned) { throw 'unsigned Windows input was not downloaded' }
          tools/sign-windows-desktop.ps1 `
            -InputPackage $unsigned.FullName `
            -Output "$env:RUNNER_TEMP\windows-signed" `
            -Publisher '${{ vars.WINDOWS_PUBLISHER }}' `
            -SigningThumbprint $env:MARVEL_WINDOWS_THUMBPRINT `
            -TimestampUrl '${{ vars.WINDOWS_TIMESTAMP_URL }}'

      - name: Destroy signing certificate
        if: always()
        shell: pwsh
        env:
          MARVEL_WINDOWS_CERTIFICATE: ${{ runner.temp }}\marvel-release.pfx
        run: |
          if ($env:MARVEL_WINDOWS_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:MARVEL_WINDOWS_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item $env:MARVEL_WINDOWS_CERTIFICATE -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-signed
          path: ${{ runner.temp }}/windows-signed/*
          if-no-files-found: error

  publish:
    name: Publish immutable desktop release
    needs: [identity, macos-sign, windows-sign]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-signed
          path: release
          merge-multiple: true

      - name: Create the release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'release already exists; published releases are immutable' >&2
            exit 2
          fi
          preview=()
          if [[ '${{ needs.identity.outputs.preview }}' == true ]]; then
            preview=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Marvel Champions ${{ needs.identity.outputs.version }}" \
            "${preview[@]}"
