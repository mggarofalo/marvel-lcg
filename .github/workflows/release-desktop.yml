name: Desktop release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Validate protected tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      preview: ${{ steps.identity.outputs.preview }}
      major: ${{ steps.identity.outputs.major }}
      minor: ${{ steps.identity.outputs.minor }}
      patch: ${{ steps.identity.outputs.patch }}
    steps:
      - name: The tag is one supported product version
        id: identity
        shell: bash
        run: |
          if [[ $GITHUB_REF_PROTECTED != true ]]; then
            echo 'release tag is not protected by an active repository ruleset' >&2
            exit 2
          fi
          version=${GITHUB_REF_NAME#v}
          if [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            preview=false
          elif [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.([1-9][0-9]*)$ ]]; then
            preview=true
          else
            echo 'release tag is not stable or preview SemVer' >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "patch=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

  quality:
    name: Ordinary release gates
    needs: identity
    uses: ./.github/workflows/ci.yml

  macos-input:
    name: Reproducible ad-hoc macOS application
    needs: [identity, quality]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.424
            10.0.400

      - name: Install pinned Godot editor and export templates
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_macos.universal.zip
          echo '92cac516baa8ddc7756eeaa38a6d007778a968bfbf188db7c5d6e6ec21c5d52c  '${RUNNER_TEMP}'/godot.zip' | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/templates.tpz" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz
          echo 'ef9a708be51ecd974cd7dccdcafd7a1870da3d3e1c24c072bdbb9818c7a7db63  '${RUNNER_TEMP}'/templates.tpz' | shasum -a 256 --check
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.1.stable.mono"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." \
            "$HOME/Library/Application Support/Godot/export_templates/4.7.1.stable.mono/"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Build ad-hoc application and release manifest
        shell: bash
        run: |
          bash tools/build-macos-desktop.sh \
            --godot "$GODOT_BIN" \
            --version '${{ needs.identity.outputs.version }}' \
            --commit '${{ needs.identity.outputs.commit }}' \
            --output "$RUNNER_TEMP/macos-input"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-community
          path: |
            ${{ runner.temp }}/macos-input/*-adhoc.zip
            ${{ runner.temp }}/macos-input/*-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows-input:
    name: Reproducible unsigned Windows input
    needs: [identity, quality]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.424
            10.0.400

      - name: Install pinned Godot editor and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip' `
            -OutFile "$env:RUNNER_TEMP\godot.zip"
          $godotHash = (Get-FileHash "$env:RUNNER_TEMP\godot.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($godotHash -cne '764a089809fb1a6f745686ce9f6d3ca83adce8fb60fb9a4e2324b63baaebaa45') { throw 'Godot editor hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot"
          Invoke-WebRequest `
            -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz' `
            -OutFile "$env:RUNNER_TEMP\templates.tpz"
          $templateHash = (Get-FileHash "$env:RUNNER_TEMP\templates.tpz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($templateHash -cne 'ef9a708be51ecd974cd7dccdcafd7a1870da3d3e1c24c072bdbb9818c7a7db63') { throw 'Godot templates hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\templates.tpz" -DestinationPath "$env:RUNNER_TEMP\templates"
          $templateTarget = Join-Path $env:APPDATA 'Godot\export_templates\4.7.1.stable.mono'
          New-Item -ItemType Directory -Path $templateTarget -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $templateTarget -Recurse -Force
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -Filter '*_console.exe' | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot .NET console executable was not found' }
          "GODOT_BIN=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build unsigned MSIX input
        shell: pwsh
        run: |
          tools/build-windows-desktop.ps1 `
            -GodotBin $env:GODOT_BIN `
            -Version '${{ needs.identity.outputs.version }}' `
            -Commit '${{ needs.identity.outputs.commit }}' `
            -Publisher 'CN=Marvel Champions Community' `
            -Output "$env:RUNNER_TEMP\windows-input"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-unsigned-input
          path: |
            ${{ runner.temp }}/windows-input/*-unsigned.msix
            ${{ runner.temp }}/windows-input/*-unsigned.msix.sha256
            ${{ runner.temp }}/windows-input/*-portable-unsigned.zip
            ${{ runner.temp }}/windows-input/*-portable-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows-community:
    name: Create and verify self-signed Windows package
    needs: [identity, windows-input]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows-unsigned-input
          path: ${{ runner.temp }}/windows-input

      - name: Generate an ephemeral key, sign without a timestamp, and verify
        shell: pwsh
        run: |
          $unsigned = Get-ChildItem "$env:RUNNER_TEMP\windows-input" -Filter '*-unsigned.msix' |
            Select-Object -First 1
          if ($null -eq $unsigned) { throw 'unsigned Windows input was not downloaded' }
          tools/sign-windows-desktop.ps1 `
            -InputPackage $unsigned.FullName `
            -Output "$env:RUNNER_TEMP\windows-community" `
            -Publisher 'CN=Marvel Champions Community'

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-community
          path: ${{ runner.temp }}/windows-community/*
          if-no-files-found: error

  server-sign:
    name: Publish and sign Linux server image
    needs: [identity, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: desktop-release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/marvel-server
      VERSION: ${{ needs.identity.outputs.version }}
      STAGING_TAG: staging-${{ needs.identity.outputs.version }}-${{ needs.identity.outputs.commit }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Reuse only a staging image signed by this protected workflow
        id: staged
        shell: bash
        run: |
          echo '${{ github.token }}' | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          found=false
          digest=''
          if manifest=$(docker buildx imagetools inspect "$IMAGE:$STAGING_TAG" 2>/dev/null); then
            digest=$(awk '$1 == "Digest:" { print $2; exit }' <<< "$manifest")
            identity="https://github.com/$GITHUB_WORKFLOW_REF"
            if [[ $digest == sha256:* ]] && cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$IMAGE@$digest" >/dev/null 2>&1; then
              found=true
            fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct '${{ needs.identity.outputs.commit }}')" >> "$GITHUB_ENV"

      - name: Build and publish the exact server image
        id: server
        if: steps.staged.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Marvel.Server/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }}:${{ env.STAGING_TAG }},push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            MARVEL_PRODUCT_VERSION=${{ needs.identity.outputs.version }}
            MARVEL_COMMIT=${{ needs.identity.outputs.commit }}
            MARVEL_VERSION_MAJOR=${{ needs.identity.outputs.major }}
            MARVEL_VERSION_MINOR=${{ needs.identity.outputs.minor }}
            MARVEL_VERSION_PATCH=${{ needs.identity.outputs.patch }}

      - name: Select the built or previously verified digest
        id: image
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.server.outputs.digest }}
          STAGED_DIGEST: ${{ steps.staged.outputs.digest }}
        run: |
          digest=$BUILT_DIGEST
          if [[ '${{ steps.staged.outputs.found }}' == true ]]; then
            digest=$STAGED_DIGEST
          fi
          [[ $digest == sha256:* ]] || { echo 'server image has no content digest' >&2; exit 2; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify image identity, sign its digest, and retain the bundle
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          reference="$IMAGE@$DIGEST"
          artifact="$RUNNER_TEMP/server-signed"
          mkdir -p "$artifact"
          docker pull --quiet "$reference" >/dev/null
          actual_version=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' \
            "$reference")
          [[ $actual_version == "$VERSION" ]] || { echo 'server image label differs from release version' >&2; exit 2; }
          docker run --rm --read-only --entrypoint dotnet "$reference" \
            Marvel.Server.dll --version | grep -F \
            "v$VERSION · engine engine-replay-v1 · protocol 12 · save 2"
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          bundle="$artifact/MarvelServer-$VERSION-linux-amd64.sigstore.json"
          cosign sign --yes --bundle "$bundle" "$reference"
          cosign verify \
            --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$reference" >/dev/null
          printf '%s\n' "$DIGEST" > \
            "$artifact/MarvelServer-$VERSION-linux-amd64.digest"
          jq -n \
            --arg product_version "$VERSION" \
            --arg commit '${{ needs.identity.outputs.commit }}' \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg cards "$(sha256sum datasets/cards/cards.json | cut -d' ' -f1)" \
            --arg setup "$(sha256sum datasets/setup/setup.json | cut -d' ' -f1)" \
            --arg abilities "$(sha256sum datasets/abilities/abilities.json | cut -d' ' -f1)" \
            '{format:"marvel-server-release",schema:1,product_version:$product_version,commit:$commit,image:$image,digest:$digest,engine_replay:"engine-replay-v1",rng:"mt19937-iso-cxx",state_digest:"state-digest-v2",protocol:11,save_schema:2,datasets:{cards_sha256:$cards,setup_sha256:$setup,abilities_sha256:$abilities}}' \
            > "$artifact/MarvelServer-$VERSION-linux-amd64.provenance.json"

      - uses: actions/upload-artifact@v7
        with:
          name: server-linux-signed
          path: ${{ runner.temp }}/server-signed/*
          if-no-files-found: error

  publish:
    name: Publish immutable community release
    needs: [identity, macos-input, windows-input, windows-community, server-sign]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-community
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows-unsigned-input
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: server-linux-signed
          path: release

      - uses: docker/setup-buildx-action@v4

      - name: Publish the immutable server version tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/marvel-server
          VERSION: ${{ needs.identity.outputs.version }}
          DIGEST: ${{ needs.server-sign.outputs.digest }}
        run: |
          echo '${{ github.token }}' | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if manifest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>/dev/null); then
            published=$(awk '$1 == "Digest:" { print $2; exit }' <<< "$manifest")
            [[ $published == "$DIGEST" ]] || {
              echo 'server version tag already names a different immutable image' >&2
              exit 2
            }
          else
            docker buildx imagetools create --prefer-index=false \
              --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
            manifest=$(docker buildx imagetools inspect "$IMAGE:$VERSION")
            published=$(awk '$1 == "Digest:" { print $2; exit }' <<< "$manifest")
            [[ $published == "$DIGEST" ]] || {
              echo 'published server tag did not preserve the signed digest' >&2
              exit 2
            }
          fi

      - name: Create the release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'release already exists; published releases are immutable' >&2
            exit 2
          fi
          preview=()
          if [[ '${{ needs.identity.outputs.preview }}' == true ]]; then
            preview=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes 'COMMUNITY ARTIFACTS: the macOS app is not notarized or Developer ID signed and requires a user-approved first launch. The Windows MSIX uses its attached self-signed certificate, is not publicly trusted, and has no trusted timestamp; the portable ZIP is unsigned. Verify the attached SHA-256 files before installation. See docs/release-policy.md.' \
            --title "Marvel Champions ${{ needs.identity.outputs.version }}" \
            "${preview[@]}"
