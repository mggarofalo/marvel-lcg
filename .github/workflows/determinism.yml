name: Determinism

# The slow half of the gate set. These re-run the engine in many fresh
# processes, so they are scheduled rather than run on every commit — a push
# gate that takes minutes stops being read.
#
# Split by OS deliberately, and the split is evidence, not caution:
#   cross-os  gates verified green on windows-latest AND ubuntu-latest
#   probes    gates that currently fail on Linux for a known, filed reason
#
# See AGENTS.md, "CI", for where MARVEL-35 and MARVEL-18 attach.

on:
  schedule:
    # 06:00 UTC nightly. Runs against master only.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: py_src

env:
  PYTHONIOENCODING: utf-8

jobs:
  cross-os:
    name: digest reproduction (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # See the note in ci.yml: a blocked device hangs rather than fails. This
    # job spawns many fresh processes, so it gets a wider budget than ci.yml.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: py_src/.python-version
          cache: pip
          cache-dependency-path: py_src/requirements.lock

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      # 12 runs over the wide matrix is 84 fresh processes per runner, about
      # 4 minutes of the 45 budgeted. The number is chosen to be affordable
      # nightly rather than to hit a confidence threshold: a hazard that
      # survives 12 identical runs is not one more run away from showing
      # itself, it is one that needs a different *case*. Widen the matrix in
      # check_runs.py before raising this again.
      - name: Digest reproduces across fresh processes
        run: python -m tools.determinism.check_runs --runs 12 --matrix wide

      # This job cannot compare operating systems -- it only ever sees its own.
      # Each runner writes its trace here and cross-os-compare diffs them once
      # both have finished.
      - name: Record this platform's digest trace
        run: |
          python -m tools.determinism.cross_os emit \
            --out trace.json --label ${{ matrix.os }} --matrix wide

      - uses: actions/upload-artifact@v7
        with:
          name: trace-${{ matrix.os }}
          path: py_src/trace.json
          if-no-files-found: error

  cross-os-compare:
    # The actual MARVEL-35 question: do Windows and Linux agree?
    #
    # `check_runs` above proves each platform reproduces itself, which is a
    # different and weaker claim -- an ordering hazard that resolves the same
    # way in every process on one machine can still resolve the other way on
    # the other machine. The audit flags the identity-hash orderings (team-up
    # units, forced-effect resolution) as the likeliest to differ under a
    # different allocator, and the decline-only driver walks both.
    #
    # A divergence here means a corpus is only valid on the platform that
    # produced it, which constrains the whole C# validation strategy. That is a
    # finding to file and stop on, not to work around.
    name: windows and linux agree
    needs: cross-os
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: py_src/.python-version
          cache: pip
          cache-dependency-path: py_src/requirements.lock

      # The comparison is pure data, but rendering a divergence calls the
      # engine's own digest differ -- see `describe_digests`. Without the
      # dependencies the report degrades to two truncated blobs exactly when it
      # matters most.
      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      # Downloaded by explicit name rather than by pattern: if one leg of the
      # matrix failed to upload, this step must fail rather than leave `compare`
      # with a single file to call green.
      - uses: actions/download-artifact@v8
        with:
          name: trace-ubuntu-latest
          path: py_src/traces/ubuntu-latest

      - uses: actions/download-artifact@v8
        with:
          name: trace-windows-latest
          path: py_src/traces/windows-latest

      - name: Per-step digests agree across operating systems
        run: |
          python -m tools.determinism.cross_os compare \
            traces/ubuntu-latest/trace.json \
            traces/windows-latest/trace.json

  probes:
    # Cross-OS as of MARVEL-35. These four gates were windows-only because all
    # four build a scratch directory with tempfile.mkdtemp(), and two separate
    # bugs ate the absolute path it returns: engine/config.py read a leading
    # `/` as a flag prefix, so the valued variable never received the path and
    # resolved to the string "True"; and FileManager.FormatPath treated only a
    # Windows drive letter as absolute, so `/tmp/x` came back anchored as
    # `./tmp/x`. MARVEL-72 fixed both.
    name: replay and invariant probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: py_src/.python-version
          cache: pip
          cache-dependency-path: py_src/requirements.lock

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      - name: Same seed writes the same saved file
        run: python -m tools.determinism.check_scene_repro

      - name: The verification gate accepts and rejects the right corpora
        run: python -m tools.replay.probe_verify

      - name: An injected invariant violation aborts and its repro reproduces
        run: python -m tools.invariants.probe_repro

      - name: An integrity error on a job thread still stops the run
        run: python -m tools.determinism.probe_threaded_integrity

      # Guards coverage rather than behaviour, which is why it is here rather
      # than in ci.yml: it exits non-zero when no forced-ability batch reached
      # the first-player tie-break, the path MARVEL-39 and MARVEL-40 both live
      # inside. Self-play could not reach it at all until MARVEL-69 gave the
      # harness a card-playing policy, and a future change to that policy could
      # take it away again without failing anything else.
      - name: Self-play still reaches the forced-ability tie-break
        run: python -m tools.determinism.probe_forced_selection

  corpus-generate:
    # MARVEL-17: a corpus must be proven to reproduce on a machine that did not
    # make it. Generating and verifying in one process proves almost nothing —
    # the same interpreter, the same filesystem, the same warm state. This pair
    # of jobs generates on Linux and verifies on Windows, which is the shape the
    # C# validation strategy actually depends on.
    #
    # Small on purpose. It is a *proof of the property*, not a corpus: the
    # expensive corpus is generated out of band by
    # `python -m tools.corpus.generate`, and what CI has to keep true is that a
    # corpus crossing an OS boundary still reproduces.
    name: generate a corpus (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: py_src/.python-version
          cache: pip
          cache-dependency-path: py_src/requirements.lock

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      # `--floor 0`: the coverage floor would demand one game per scenario, 108
      # of them, which is a corpus rather than a proof. The seed is fixed so a
      # failure here names one reproducible corpus.
      - name: Generate
        run: |
          python -m tools.corpus.generate \
            --out ./corpus/ --games 12 --floor 0 --seed 4242 \
            --scenarios rhino,klaw,ultron \
            --heroes spider_man,she_hulk,captain_marvel,thor \
            --workers 2

      - uses: actions/upload-artifact@v7
        with:
          name: corpus-ubuntu
          path: py_src/corpus
          retention-days: 3

  corpus-verify:
    # The other half. `needs` rather than a pattern download: if generation
    # failed, this must not run and quietly pass on an empty folder.
    name: it reproduces on the other OS (windows)
    needs: corpus-generate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: py_src/.python-version
          cache: pip
          cache-dependency-path: py_src/requirements.lock

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      - uses: actions/download-artifact@v8
        with:
          name: corpus-ubuntu
          path: py_src/corpus

      # Verifying nothing exits non-zero, so a corpus that failed to transfer
      # fails here rather than reporting a clean run over an empty folder.
      # The quarantine folder is always written, even when empty — "nothing was
      # quarantined" and "quarantining never ran" must not look alike.
      - name: Every scene reproduces, and the config it was made under matches
        run: |
          python main.py -verify_replays -verify_folders ./corpus/ \
            -verify_report_file ./verify.json \
            -verify_quarantine_folder ./quarantine/

      # Only on failure: the whole point is the *reasons*, and on a green run
      # there are none. See MARVEL-17 — a non-reproducing replay must never be
      # silently dropped.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: corpus-quarantine
          path: |
            py_src/quarantine
            py_src/verify.json
          retention-days: 14

  # MARVEL-18 attaches here: a job that verifies the frozen corpus manifest
  # hash. It needs a frozen corpus to exist first, so it is named but not
  # stubbed — an empty job that always passes is worse than no job.
